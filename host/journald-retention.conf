# Copy to /etc/systemd/journald.conf.d/retention.conf on the VPS (see README).
# The privacy policy promises that logs are deleted after 14 days at the latest. journald deletes whole
# files: with one file per day and 13 days retention, no entry is older than 14 days.
[Journal]
Storage=persistent
MaxFileSec=1day
MaxRetentionSec=13day
