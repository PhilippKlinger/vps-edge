# Shared edge proxy: the only container on the VPS that publishes ports.
# Project stacks join the external network "edge" and are reached by their network alias.
name: edge

services:
  caddy:
    image: caddy:2.11.9-alpine@sha256:0bbb055bda6793c999bde78b1b5ce3e89f829fb031af2cf50056ea1246559fee
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Contact for the certificate authority (expiry notices), not published anywhere
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - caddy_data:/data
      - caddy_config:/config
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # json-file only rotates by size; the time limit comes from host/journald-retention.conf
    logging:
      driver: journald
    # edge: project stacks; monitoring: Uptime Kuma (vps-monitoring), nothing else
    networks: [edge, monitoring]

networks:
  edge:
    # Fixed name, so project stacks can join it as an external network
    name: edge
  monitoring:
    # Fixed name, joined by vps-monitoring. Internal: only Caddy and Kuma, no route outside.
    # Owned here, so the proxy starts even if the monitoring stack is missing.
    name: monitoring
    internal: true

volumes:
  # Certificates and ACME account: keep this volume, otherwise Caddy requests new certificates
  caddy_data:
  caddy_config:
