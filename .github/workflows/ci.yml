# Actions are pinned by commit SHA; the comment shows the readable version.
# Validates the proxy configuration, starts it for real against stand-in upstreams and scans the image.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Scheduled runs catch image vulnerabilities published after the last push.
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_IMAGE: aquasec/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
  # Tiny HTTP server that answers every path with its own hostname: shows which upstream Caddy chose
  STUB_IMAGE: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
  # Placeholder for the compose file; no certificate is requested in CI
  ACME_EMAIL: ci@example.com

jobs:
  validate:
    name: Validate compose, Caddyfile and workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate compose.yaml
        run: docker compose config --quiet

      - name: Validate Caddyfile
        run: |
          set -Eeuo pipefail
          image="$(sed -n 's/^ *image: *//p' compose.yaml)"
          docker run --rm -e ACME_EMAIL \
            -v "${PWD}/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "${PWD}/sites:/etc/caddy/sites:ro" \
            "${image}" caddy validate --config /etc/caddy/Caddyfile

      - name: Lint workflows (actionlint)
        run: docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

  smoke-test:
    name: Routing and status page allowlist
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same configuration, but certificates from Caddy's local CA instead of Let's Encrypt.
      - name: Prepare test configuration
        run: |
          set -Eeuo pipefail
          sed '1s/^{$/{\n\tlocal_certs/' Caddyfile > "${RUNNER_TEMP}/Caddyfile"
          head -3 "${RUNNER_TEMP}/Caddyfile"
          cat > "${RUNNER_TEMP}/compose.ci.yaml" <<EOF
          services:
            caddy:
              volumes:
                - ${RUNNER_TEMP}/Caddyfile:/etc/caddy/Caddyfile:ro
          EOF

      - name: Start proxy and stand-in upstreams
        run: |
          set -Eeuo pipefail
          docker compose -f compose.yaml -f "${RUNNER_TEMP}/compose.ci.yaml" up -d
          docker run -d --name videoflix-web --hostname videoflix-web --network edge --network-alias videoflix-web "${STUB_IMAGE}" --port 8000
          docker run -d --name videoflix-frontend --hostname videoflix-frontend --network edge --network-alias videoflix-frontend "${STUB_IMAGE}" --port 8080
          docker run -d --name uptime-kuma --hostname uptime-kuma --network monitoring --network-alias uptime-kuma "${STUB_IMAGE}" --port 3001

      - name: Wait until Caddy answers
        run: |
          set -Eeuo pipefail
          for _ in $(seq 1 30); do
            if curl -sk -o /dev/null --resolve status.philipp-klinger.com:443:127.0.0.1 https://status.philipp-klinger.com/status/videoflix; then
              exit 0
            fi
            sleep 2
          done
          echo "::error::Caddy did not answer within 60 seconds"
          exit 1

      - name: Check routes
        run: |
          set -Eeuo pipefail
          failed=0

          # expect <host> <method> <path> <status> [<upstream hostname in the body>]
          expect() {
            local host="$1" method="$2" path="$3" status="$4" upstream="${5:-}" body code
            body="$(mktemp)"
            code="$(curl -sk -o "${body}" -w '%{http_code}' -X "${method}" \
              --resolve "${host}:443:127.0.0.1" "https://${host}${path}")"
            if [ "${code}" != "${status}" ]; then
              echo "::error::${method} ${host}${path}: expected ${status}, got ${code}"
              failed=1
            elif [ -n "${upstream}" ] && ! grep -q "^Hostname: ${upstream}\b" "${body}"; then
              echo "::error::${method} ${host}${path}: answered by the wrong upstream"
              failed=1
            else
              echo "ok  ${method} ${host}${path} -> ${code} ${upstream}"
            fi
            rm -f "${body}"
          }

          status=status.philipp-klinger.com
          # Public part of Uptime Kuma
          expect "${status}" GET /status/videoflix 200 uptime-kuma
          expect "${status}" GET /api/status-page/videoflix 200 uptime-kuma
          expect "${status}" GET /api/status-page/heartbeat/videoflix 200 uptime-kuma
          expect "${status}" GET /api/badge/1/status 200 uptime-kuma
          expect "${status}" GET /assets/index.js 200 uptime-kuma
          expect "${status}" GET /icon.svg 200 uptime-kuma
          expect "${status}" GET / 302
          # Everything else stays closed: dashboard, login, live connection, metrics, push, setup
          expect "${status}" GET /dashboard 404
          expect "${status}" GET /settings/general 404
          expect "${status}" GET /socket.io/ 404
          expect "${status}" GET /metrics 404
          expect "${status}" GET /api/push/token 404
          expect "${status}" GET /api/entry-page 404
          expect "${status}" GET /setup-database-info 404
          expect "${status}" POST /api/status-page/videoflix 404

          videoflix=videoflix.philipp-klinger.com
          expect "${videoflix}" GET /api/health/ 200 videoflix-web
          expect "${videoflix}" GET /admin/ 200 videoflix-web
          expect "${videoflix}" GET /static/app.css 200 videoflix-web
          expect "${videoflix}" GET / 200 videoflix-frontend
          expect "${videoflix}" GET /browse 200 videoflix-frontend

          exit "${failed}"

      - name: Check redirect and security headers
        run: |
          set -Eeuo pipefail
          redirect="$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' \
            --resolve status.philipp-klinger.com:80:127.0.0.1 http://status.philipp-klinger.com/status/videoflix)"
          echo "HTTP: ${redirect}"
          test "${redirect}" = "308 https://status.philipp-klinger.com/status/videoflix"

          location="$(curl -sk -o /dev/null -w '%{redirect_url}' \
            --resolve status.philipp-klinger.com:443:127.0.0.1 https://status.philipp-klinger.com/)"
          echo "Start page: ${location}"
          test "${location}" = "https://status.philipp-klinger.com/status/overview"

          headers="$(curl -sk -D - -o /dev/null \
            --resolve status.philipp-klinger.com:443:127.0.0.1 https://status.philipp-klinger.com/status/videoflix)"
          echo "${headers}"
          grep -qi '^strict-transport-security: max-age=31536000; includeSubDomains' <<< "${headers}"
          grep -qi '^x-content-type-options: nosniff' <<< "${headers}"
          grep -qi '^referrer-policy: strict-origin-when-cross-origin' <<< "${headers}"
          if grep -qi '^server:' <<< "${headers}"; then
            echo "::error::Server header is exposed"
            exit 1
          fi

      # Only Caddy may publish ports; the internal network has no route outside.
      - name: Check published ports and networks
        run: |
          set -Eeuo pipefail
          docker compose ps --format '{{.Name}} {{.Ports}}'
          test "$(docker network inspect monitoring --format '{{.Internal}}')" = "true"

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop everything
        if: always()
        run: |
          docker rm -f videoflix-web videoflix-frontend uptime-kuma || true
          docker compose -f compose.yaml -f "${RUNNER_TEMP}/compose.ci.yaml" down --volumes

  image-scan:
    name: Scan pinned image (Trivy)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Official Trivy image pinned by digest instead of a third-party action.
      # Reports HIGH and CRITICAL, fails on critical findings that already have a fix.
      - name: Scan image with Trivy
        run: |
          set -Eeuo pipefail
          image="$(sed -n 's/^ *image: *//p' compose.yaml)"
          echo "Image: ${image}"
          docker run --rm "${TRIVY_IMAGE}" image --no-progress --severity HIGH,CRITICAL --ignore-unfixed "${image}"
          docker run --rm "${TRIVY_IMAGE}" image --no-progress --quiet --severity CRITICAL --ignore-unfixed --exit-code 1 "${image}"
